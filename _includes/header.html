<header class="header" itemscope itemtype="http://schema.org/SiteNavigationElement" aria-label="Main navigation">
  <div class="container">
    <div class="header__inner">
      <a class="header__logo" href="{{ '/' | relative_url }}">
        <div class="header__logo--container">
          {% include logo.svg %}
        </div>
      </a>
      <div class="header__actions">
        <nav class="header__links">
          <div class="container header__links-wrapper">
            {% for item in site.navigation %}
              <a class="header__link" href="{{ item.link | relative_url }}" itemprop="url">
                <span itemprop="name">{{ item.name }}</span>
              </a>
            {% endfor %}
            <div
              id="google_translate_element"
              class="language-widget"
              aria-label="Selecionar idioma"
            ></div>
          </div>
        </nav>
        <button class="theme-toggle" type="button" aria-label="Ativar modo escuro" aria-pressed="false">
          <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 14.6A8.4 8.4 0 0 1 9.4 3 7.9 7.9 0 1 0 21 14.6Z"></path>
          </svg>
          <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
          </svg>
        </button>
        <div class="header__toggle">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
  </div>
</header>
