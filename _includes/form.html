<form id="contactForm" action="{{ site.formspree_endpoint }}" method="POST" novalidate>
  <div class="form__input half">
    <label for="name">Nome</label>
    <input type="text" name="name" id="name" autocomplete="name" required>
  </div>

  <div class="form__input input half">
    <label for="email">E-mail</label>
    <input type="email" name="email" id="email" autocomplete="email" required>
  </div>

  <div class="form__input">
    <label for="message">Mensagem</label>
    <textarea name="message" id="message" rows="7" autocomplete="message" required></textarea>
  </div>

  <input type="hidden" name="_subject" value="Website Form submission">
  <input type="hidden" name="_format" value="plain" />
  <input class="hidden" type="text" name="_gotcha">
  <button class="btn js-submit" type="submit" value="Enviar">Enviar</button>
</form>
